# CI: lint + type-check + tests + build en cada push y en PRs hacia master.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Valores dummy: el cliente Supabase tolera su ausencia con un warning,
      # y el build no necesita credenciales reales.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No descargar los modelos .glb de Git LFS (no se necesitan en CI)
          lfs: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
